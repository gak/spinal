[package]
name = "spinal-phase0a"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Opt-in evidence harness for Spinal's Phase 0A editor checks"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
