[workspace]
resolver = "3"
members = [
    "apps/spinal",
    "bevy_spinal",
    "spinal",
    "tools/spinal-phase0a",
    "tools/spinal-phase0b",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gak/spinal"

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false }
glam = { version = "0.32.1", default-features = false, features = ["std"] }
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.9"
png = "0.18.1"
thiserror = "2.0.18"
toml = "0.9.12"
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
