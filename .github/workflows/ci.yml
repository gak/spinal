name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-stable:
    name: Stable quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit generic repository content
        run: bash tools/audit-genericity.sh

      - name: Validate accessibility evidence tooling
        run: |
          bash -n tools/accessibility-preflight.sh
          python3 -m json.tool docs/accessibility-report-v1.example.json >/dev/null
          python3 tools/accessibility-report-check.py --self-test
          python3 tools/accessibility-report-check.py --check-template docs/accessibility-report-v1.example.json

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Audit resolved runtime dependency profile
        run: |
          python3 tools/check-dependency-profile.py --self-test
          python3 tools/check-dependency-profile.py

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Check fuzz-target formatting
        run: cargo +stable fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Run tests
        run: cargo +stable test --workspace --all-targets --locked

      - name: Run headless Bevy adapter tests
        run: cargo +stable test --package bevy_spinal --no-default-features --locked

      - name: Test the Bevy runtime showcase
        run: cargo +stable test --package bevy_spinal --example runtime_showcase --features desktop --locked

      - name: Test the Spinal application
        run: cargo +stable test --package spinal-app --all-targets --locked

      - name: Lint loader fuzz targets
        run: cargo +stable clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings

      - name: Run loader seed-corpus smoke tests
        run: |
          cargo +stable run --manifest-path fuzz/Cargo.toml --bin skeleton_json --locked -- -runs=256 fuzz/corpus/skeleton_json
          cargo +stable run --manifest-path fuzz/Cargo.toml --bin text_atlas --locked -- -runs=256 fuzz/corpus/text_atlas

      - name: Run documentation tests
        run: cargo +stable test --workspace --doc --locked

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --locked

  browser-wasm:
    name: Browser WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust with WebAssembly support
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Install pinned Trunk
        run: cargo +stable install trunk --version 0.21.14 --locked

      - name: Test browser-only logic
        run: cargo +stable test --package spinal-app --no-default-features --features web --lib --locked

      - name: Test the opt-in Phase 0B browser observation path
        run: cargo +stable test --package spinal-app --no-default-features --features phase0b-rehearsal --lib --locked

      - name: Lint the production WebAssembly host
        run: cargo +stable clippy --package spinal-app --all-targets --no-default-features --features web --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Lint the opt-in Phase 0B browser observation path
        run: cargo +stable clippy --package spinal-app --all-targets --no-default-features --features phase0b-rehearsal --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Build and render the browser host
        run: bash tools/web-smoke.sh

  desktop-cross-platform:
    name: Desktop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test the Spinal application
        run: cargo +stable test --package spinal-app --all-targets --locked

      - name: Test the Bevy runtime showcase
        run: cargo +stable test --package bevy_spinal --example runtime_showcase --features desktop --locked

  msrv:
    name: Rust 1.95 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0

      - name: Run tests
        run: cargo +1.95.0 test --workspace --all-targets --locked

      - name: Run headless Bevy adapter tests
        run: cargo +1.95.0 test --package bevy_spinal --no-default-features --locked

      - name: Test the Bevy runtime showcase
        run: cargo +1.95.0 test --package bevy_spinal --example runtime_showcase --features desktop --locked

      - name: Test the Spinal application
        run: cargo +1.95.0 test --package spinal-app --all-targets --locked

      - name: Compile the production browser host at MSRV
        run: cargo +1.95.0 build --package spinal-app --bin spinal-web --no-default-features --features web --target wasm32-unknown-unknown --locked

      - name: Compile the opt-in Phase 0B browser observation path at MSRV
        run: cargo +1.95.0 build --package spinal-app --bin spinal-web --no-default-features --features phase0b-rehearsal --target wasm32-unknown-unknown --locked

      - name: Compile loader fuzz targets
        run: cargo +1.95.0 check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: Run documentation tests
        run: cargo +1.95.0 test --workspace --doc --locked

  fuzz-smoke:
    name: Bounded fuzz smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz skeleton JSON
        run: cargo +nightly fuzz run skeleton_json -- -max_total_time=30

      - name: Fuzz text atlases
        run: cargo +nightly fuzz run text_atlas -- -max_total_time=30

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --version 0.18.9 --locked

      - name: Audit dependencies
        run: cargo +stable deny --locked check

      - name: Audit fuzz-tool dependencies
        run: cargo +stable deny --manifest-path fuzz/Cargo.toml --locked check --config ../deny.toml

  package-audit:
    name: Package audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Audit package contents
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash tools/audit-package.sh

      - name: Verify historical asset checksums
        run: sha256sum --check assets/SHA256SUMS

      - name: Build package archive
        run: cargo +stable package --package spinal --locked
