name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-stable:
    name: Stable quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Run tests
        run: cargo +stable test --workspace --all-targets --locked

      - name: Run documentation tests
        run: cargo +stable test --workspace --doc --locked

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --locked

  msrv:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Run tests
        run: cargo +1.89.0 test --workspace --all-targets --locked

      - name: Run documentation tests
        run: cargo +1.89.0 test --workspace --doc --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --version 0.18.9 --locked

      - name: Audit dependencies
        run: cargo +stable deny --locked check

  package-audit:
    name: Package audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # Source: https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Audit package contents
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash tools/audit-package.sh

      - name: Verify historical asset checksums
        run: sha256sum --check assets/SHA256SUMS

      - name: Build package archive
        run: cargo +stable package --package spinal --locked
