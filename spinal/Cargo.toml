[package]
name = "spinal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A clean-room, renderer-independent Spine 2D runtime core."
readme = "README.md"
publish = false
include = [
    "src/animation.rs",
    "src/asset.rs",
    "src/atlas.rs",
    "src/diagnostic.rs",
    "src/draw.rs",
    "src/frame.rs",
    "src/geometry.rs",
    "src/id.rs",
    "src/json.rs",
    "src/load/animation.rs",
    "src/load/build.rs",
    "src/lib.rs",
    "src/load/error.rs",
    "src/load/mesh.rs",
    "src/load/mod.rs",
    "src/load/schema.rs",
    "src/math.rs",
    "src/mesh.rs",
    "src/mixer.rs",
    "src/player.rs",
    "src/pose.rs",
    "src/runtime_bundle.rs",
    "src/semantic_frame.rs",
    "src/skeleton.rs",
    "src/world.rs",
    "tests/frame_contract.rs",
    "tests/clipping_attachment_contract.rs",
    "tests/deform_timeline_contract.rs",
    "tests/editor_4_3_23_contract.rs",
    "tests/loading_contract.rs",
    "tests/mixer_contract.rs",
    "tests/player_contract.rs",
    "tests/public_contract.rs",
    "tests/runtime_contract.rs",
    "tests/semantic_frame_contract.rs",
    "tests/single_axis_timeline_contract.rs",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
glam.workspace = true
png.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
allocation-counter = "0.8.1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
