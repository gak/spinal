[package]
name = "bevy_spinal"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fresh Bevy 0.19 adapter for the clean-room Spinal runtime core"
keywords = ["animation", "bevy", "spine", "2d"]
categories = ["game-development", "graphics", "rendering"]
readme = "README.md"
include = [
    "examples/**/*.rs",
    "examples/assets/**",
    "src/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[features]
default = ["render"]
render = ["bevy/2d_bevy_render"]
desktop = [
    "render",
    "bevy/bevy_winit",
    "bevy/default_app",
    "bevy/multi_threaded",
    "bevy/x11",
]

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_sprite",
    "png",
    "std",
] }
serde.workspace = true
spinal = { path = "../spinal", version = "0.1.0" }
thiserror.workspace = true

[dev-dependencies]
allocation-counter = "0.8.1"
serde_json.workspace = true

[lints]
workspace = true

[[example]]
name = "runtime_showcase"
required-features = ["desktop"]
