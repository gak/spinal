<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">
    <title>Spinal — Preview</title>
    <script>
      (() => {
        "use strict";

        let startTimer;
        const applyStatus = (kind, message) => {
          const apply = () => {
            const app = document.getElementById("spinal-app");
            const status = document.getElementById("spinal-status");
            const canvas = document.getElementById("spinal-canvas");
            if (!app || !status || !canvas) return;
            status.textContent = message;
            status.dataset.state = kind;
            canvas.setAttribute("aria-label", `Spinal preview. ${message}`);
            app.setAttribute("aria-busy", kind === "loading" ? "true" : "false");
            if (kind !== "loading") window.clearTimeout(startTimer);
          };
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", apply, { once: true });
          } else {
            apply();
          }
        };

        window.spinalSetShellStatus = applyStatus;
        window.spinalRuntimeStarted = () => window.clearTimeout(startTimer);
        const blockWhileStarting = (message) => {
          const state = document.getElementById("spinal-status")?.dataset.state;
          if (!state || state === "loading") applyStatus("blocked", message);
        };
        window.addEventListener(
          "error",
          (event) => {
            if (event.target instanceof HTMLScriptElement) {
              blockWhileStarting("Preview blocked — the viewer could not start");
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", () => {
          blockWhileStarting("Preview blocked — WebAssembly could not start");
        });
        startTimer = window.setTimeout(() => {
          blockWhileStarting("Preview blocked — the viewer did not start in time");
        }, 30000);
        document.addEventListener("DOMContentLoaded", () => {
          const canvas = document.getElementById("spinal-canvas");
          canvas?.addEventListener("webglcontextlost", (event) => {
            event.preventDefault();
            applyStatus("blocked", "Preview blocked — browser graphics were lost");
          });

          const app = document.getElementById("spinal-app");
          let commandSequence = 0;
          const postCommand = (action, payload) => {
            const capability = app?.getAttribute("data-spinal-command-capability");
            if (
              !capability ||
              !action ||
              commandSequence >= Number.MAX_SAFE_INTEGER
            ) return;
            commandSequence += 1;
            const envelope = {
              type: "spinal.viewer.command",
              version: 1,
              capability,
              sequence: commandSequence,
              action,
            };
            if (payload !== undefined) envelope.payload = payload;
            window.postMessage(JSON.stringify(envelope), window.location.origin);
          };
          document.querySelectorAll("button[data-spinal-action]").forEach((button) => {
            button.addEventListener("click", () => {
              const action = button.getAttribute("data-spinal-action");
              postCommand(action);
            });
          });

          const animation = document.getElementById("spinal-animation-select");
          animation?.addEventListener("change", () => {
            postCommand("select-animation", { animation: animation.value });
          });
          const looping = document.getElementById("spinal-looping");
          looping?.addEventListener("change", () => {
            postCommand("set-looping", { looping: looping.checked });
          });
          const speed = document.getElementById("spinal-speed");
          speed?.addEventListener("change", () => {
            postCommand("set-playback-speed", {
              multiplier: Number.parseFloat(speed.value),
            });
          });
          const timeline = document.getElementById("spinal-timeline");
          const timelineValue = document.getElementById("spinal-timeline-value");
          let seekFrame = 0;
          const postLatestSeek = () => {
            seekFrame = 0;
            postCommand("seek-absolute", {
              position_milliseconds: Number.parseInt(timeline.value, 10),
            });
          };
          timeline?.addEventListener("input", () => {
            if (timelineValue) {
              const position = Number.parseInt(timeline.value, 10) / 1000;
              const duration = Number.parseInt(timeline.max, 10) / 1000;
              timelineValue.textContent = `${position.toFixed(3)} / ${duration.toFixed(3)} s`;
            }
            if (!seekFrame) seekFrame = window.requestAnimationFrame(postLatestSeek);
          });
        });
      })();
    </script>
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="spinal-web"
      data-cargo-no-default-features
      data-cargo-features="web"
      data-cargo-profile-release="web-release"
      data-wasm-opt="z"
    >
    <link data-trunk rel="copy-file" href="bundle/manifest.json" data-target-path="bundle">
    <link data-trunk rel="copy-file" href="bundle/viewer.spine.json" data-target-path="bundle">
    <link data-trunk rel="copy-file" href="bundle/viewer.atlas" data-target-path="bundle">
    <link data-trunk rel="copy-file" href="bundle/viewer.png" data-target-path="bundle">
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07090d;
        color: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-width: 20rem;
        overflow: auto;
        background:
          radial-gradient(circle at 25% -10%, #1a2232 0, transparent 32rem),
          #07090d;
      }

      #spinal-app {
        display: grid;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        grid-template-rows: auto minmax(22rem, 1fr);
      }

      .app-header {
        display: flex;
        min-height: 3.75rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #2c3442;
        background: rgb(12 16 23 / 92%);
      }

      .identity {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 0.75rem;
      }

      .identity strong {
        font-size: 1.125rem;
        letter-spacing: 0.01em;
      }

      .identity span {
        overflow: hidden;
        color: #aeb8c8;
        font-size: 0.875rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #spinal-status {
        display: inline-flex;
        max-width: min(58rem, 70vw);
        align-items: center;
        gap: 0.5rem;
        color: #dce3ee;
        font-size: 0.875rem;
        line-height: 1.35;
        overflow-wrap: anywhere;
        text-align: right;
      }

      #spinal-status::before {
        width: 0.625rem;
        height: 0.625rem;
        flex: 0 0 auto;
        border: 2px solid currentColor;
        border-radius: 50%;
        content: "";
      }

      #spinal-status[data-state="ready"] {
        color: #b9f5d0;
      }

      #spinal-status[data-state="warning"] {
        color: #ffe09d;
      }

      #spinal-status[data-state="blocked"] {
        color: #ffd1d1;
      }

      #spinal-status[data-state="blocked"]::before {
        border-radius: 0.125rem;
      }

      .preview-region {
        display: grid;
        min-height: 22rem;
        grid-template-rows: minmax(18rem, 1fr) auto;
        gap: 0.75rem;
        padding: 0.75rem;
      }

      .canvas-frame {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid #30394a;
        border-radius: 0.75rem;
        background: #06080b;
        box-shadow: 0 1.25rem 4rem rgb(0 0 0 / 28%);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .transport {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .transport-fields {
        display: grid;
        width: min(100%, 58rem);
        grid-template-columns: minmax(12rem, 2fr) minmax(7rem, 1fr) auto;
        gap: 0.625rem 0.875rem;
        align-items: end;
      }

      .control-field {
        display: grid;
        gap: 0.3rem;
        color: #dce3ee;
        font-size: 0.8125rem;
        font-weight: 650;
      }

      .control-field select,
      .control-field input[type="range"] {
        width: 100%;
      }

      .control-field select {
        min-height: 2.75rem;
        padding: 0.5rem;
        border: 1px solid #465267;
        border-radius: 0.5rem;
        background: #151b25;
        color: #f5f7fb;
        font: inherit;
      }

      .loop-control {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        gap: 0.5rem;
        padding: 0 0.5rem;
        font-weight: 650;
      }

      .timeline-field {
        grid-column: 1 / -1;
      }

      .timeline-heading {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }

      .transport select:focus-visible,
      .transport input:focus-visible {
        outline: 3px solid #9cc4ff;
        outline-offset: 2px;
      }

      .transport button {
        min-height: 2.75rem;
        padding: 0.625rem 0.875rem;
        border: 1px solid #465267;
        border-radius: 0.5rem;
        background: #151b25;
        color: #f5f7fb;
        font: inherit;
        font-weight: 650;
        line-height: 1.2;
        cursor: pointer;
      }

      .transport button:hover:not(:disabled) {
        border-color: #8094b7;
        background: #202a3a;
      }

      .transport button:focus-visible {
        outline: 3px solid #9cc4ff;
        outline-offset: 2px;
      }

      .transport button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      noscript {
        position: fixed;
        z-index: 10;
        inset: 1rem;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 2rem;
        border: 2px solid currentColor;
        background: #07090d;
        font-size: 1.125rem;
        text-align: center;
      }

      @media (max-width: 48rem) {
        .app-header {
          align-items: flex-start;
          flex-direction: column;
        }

        #spinal-status {
          max-width: none;
          text-align: left;
        }

        .transport button {
          flex: 1 1 8rem;
        }

        .transport-fields {
          grid-template-columns: 1fr 1fr;
        }

        .control-field:first-child,
        .timeline-field {
          grid-column: 1 / -1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (forced-colors: active) {
        .app-header,
        .canvas-frame,
        .transport button {
          border-color: CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <main
      id="spinal-app"
      data-spinal-manifest="./bundle/manifest.json"
      aria-labelledby="spinal-title"
      aria-busy="true"
    >
      <header class="app-header">
        <div class="identity">
          <strong id="spinal-title">Spinal</strong>
          <span>Animation preview</span>
        </div>
        <div
          id="spinal-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          data-state="loading"
        >Loading preview…</div>
      </header>
      <section class="preview-region" aria-labelledby="preview-heading">
        <h1 id="preview-heading" class="visually-hidden">Animation canvas</h1>
        <div class="canvas-frame">
          <canvas
            id="spinal-canvas"
            role="img"
            aria-label="Spinal Preview. Loading."
            aria-describedby="spinal-status"
          ></canvas>
        </div>
        <div
          id="spinal-transport"
          class="transport"
          role="group"
          aria-label="Animation playback controls"
        >
          <div class="transport-fields">
            <label class="control-field" for="spinal-animation-select">
              Animation
              <select id="spinal-animation-select" aria-controls="spinal-canvas" disabled>
                <option value="">Loading animations…</option>
              </select>
            </label>
            <label class="control-field" for="spinal-speed">
              Playback speed
              <select id="spinal-speed" aria-controls="spinal-canvas" disabled>
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2×</option>
              </select>
            </label>
            <label class="loop-control" for="spinal-looping">
              <input
                id="spinal-looping"
                type="checkbox"
                aria-controls="spinal-canvas"
                checked
                disabled
              >
              Loop
            </label>
            <label class="control-field timeline-field" for="spinal-timeline">
              <span class="timeline-heading">
                <span>Timeline</span>
                <output id="spinal-timeline-value" for="spinal-timeline">0.000 / 0.000 s</output>
              </span>
              <input
                id="spinal-timeline"
                type="range"
                min="0"
                max="0"
                step="1"
                value="0"
                aria-controls="spinal-canvas"
                disabled
              >
            </label>
          </div>
          <button
            id="spinal-restart"
            type="button"
            data-spinal-action="restart"
            aria-controls="spinal-canvas"
            disabled
          >Restart</button>
          <button
            id="spinal-step-backward"
            type="button"
            data-spinal-action="step-backward"
            aria-controls="spinal-canvas"
            disabled
          >Previous frame</button>
          <button
            id="spinal-play-toggle"
            type="button"
            data-spinal-action="toggle-pause"
            aria-controls="spinal-canvas"
            aria-label="Play"
            disabled
          >Play</button>
          <button
            id="spinal-step-forward"
            type="button"
            data-spinal-action="step-forward"
            aria-controls="spinal-canvas"
            disabled
          >Next frame</button>
          <button
            id="spinal-refit"
            type="button"
            data-spinal-action="refit"
            aria-controls="spinal-canvas"
            disabled
          >Fit</button>
        </div>
      </section>
    </main>
    <noscript>Spinal’s browser preview requires JavaScript and WebAssembly.</noscript>
  </body>
</html>
