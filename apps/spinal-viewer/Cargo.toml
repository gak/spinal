[package]
name = "spinal-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = [
    "dep:accesskit",
    "bevy/bevy_input_focus",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/default_font",
    "bevy/multi_threaded",
]
web = ["bevy/web", "bevy/webgpu"]

[dependencies]
accesskit = { version = "0.21.1", optional = true }
bevy = { workspace = true, features = [
    "2d_bevy_render",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_sprite",
    "bevy_winit",
    "default_app",
    "png",
    "std",
] }
bevy_spinal = { path = "../../bevy_spinal", version = "0.1.0", default-features = false, features = ["render"] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11"] }

[lints]
workspace = true

[[bin]]
name = "spinal-viewer"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "spinal-viewer-web"
path = "src/web_main.rs"
required-features = ["web"]
