[package]
name = "spinal-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = [
    "dep:accesskit",
    "bevy/bevy_input_focus",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/default_font",
    "bevy/multi_threaded",
]
web = [
    "bevy/web",
    "bevy/webgl2",
    "dep:js-sys",
    "dep:serde",
    "dep:serde_json",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
accesskit = { version = "0.21.1", optional = true }
bevy = { workspace = true, features = [
    "2d_bevy_render",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_sprite",
    "bevy_winit",
    "default_app",
    "png",
    "std",
] }
bevy_spinal = { path = "../../bevy_spinal", version = "0.1.0", default-features = false, features = ["render"] }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "console",
    "AbortController",
    "AbortSignal",
    "Document",
    "Element",
    "Headers",
    "Location",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "HtmlCanvasElement",
    "Url",
    "Window",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[[bin]]
name = "spinal-viewer"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "spinal-viewer-web"
path = "src/web_main.rs"
required-features = ["web"]
